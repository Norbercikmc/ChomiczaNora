<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chomicza Nora</title>
  <meta name="description" content="Projekt Maszynownia — self-hostingowy HomeLAB: serwery Discord, Minecraft, Teamspeak i więcej. Dołącz do społeczności!">
  <meta name="keywords" content="Chomicza Nora, Projekt Maszynownia, Self-Hosting, HomeLAB, Serwery, Discord, Minecraft, Teamspeak">

  <meta property="og:description" content="Self-hostingowy HomeLAB: serwery Discord, Minecraft, Teamspeak i więcej!">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      will-change: transform;
    }
    .glow--1 {
      width: 55vmax; height: 55vmax;
      left: -15vmax; bottom: -15vmax;
      background: radial-gradient(circle, rgba(109, 40, 217, 0.9), transparent 65%);
      animation: drift-1 18s ease-in-out infinite alternate;
    }
    .glow--2 {
      width: 45vmax; height: 45vmax;
      right: -12vmax; top: -12vmax;
      background: radial-gradient(circle, rgba(67, 56, 202, 0.85), transparent 65%);
      animation: drift-2 22s ease-in-out infinite alternate;
    }
    .glow--3 {
      width: 35vmax; height: 35vmax;
      left: 35%; bottom: -20vmax;
      background: radial-gradient(circle, rgba(19, 195, 164, 0.5), transparent 65%);
      animation: drift-3 26s ease-in-out infinite alternate;
    }

    @keyframes drift-1 { to { transform: translate(25vmax, -15vmax) scale(1.2); } }
    @keyframes drift-2 { to { transform: translate(-20vmax, 20vmax) scale(0.85); } }
    @keyframes drift-3 { to { transform: translate(-15vmax, -10vmax) scale(1.3); } }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 20%, #fff, transparent),
        radial-gradient(1px 1px at 28% 72%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 45% 35%, #c4b5fd, transparent),
        radial-gradient(1px 1px at 63% 82%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 78% 18%, #fff, transparent),
        radial-gradient(1px 1px at 90% 58%, #c4b5fd, transparent),
        radial-gradient(1px 1px at 6% 88%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 55% 8%, #fff, transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    .stars--2 {
      background-position: 40px 60px;
      background-size: 70% 70%;
      animation-duration: 6s;
      animation-delay: -2s;
    }

    @keyframes twinkle { from { opacity: 0.15; } to { opacity: 1; } }

    .logo-wrap {
      position: relative;
      z-index: 1;
      animation: appear 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .logo {
      display: block;
      width: min(320px, 60vw);
      height: auto;
      filter: drop-shadow(0 0 40px rgba(109, 40, 217, 0.7));
      animation: float 6s ease-in-out infinite;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    .discord-btn {
      position: absolute;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      font: 600 0.85rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: #5865F2;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .discord-btn:hover,
    .discord-btn:focus-visible {
      background: #4752c4;
      box-shadow: 0 0 24px rgba(88, 101, 242, 0.6);
    }

    .secret {
      position: fixed;
      right: 0.75rem;
      bottom: 0.5rem;
      z-index: 1;
      font: 0.7rem/1 ui-monospace, Consolas, monospace;
      color: rgba(255, 255, 255, 0.04);
      transition: color 0.4s;
    }
    .secret:hover,
    .secret:focus { color: rgba(255, 255, 255, 0.7); outline: none; }

    .egg {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      z-index: 2;
      padding: 0.6rem 1.2rem;
      font: 600 0.95rem/1.3 ui-monospace, Consolas, monospace;
      color: #fff;
      background: #62A87C;
      border: 3px solid #2f5a40;
      border-radius: 4px;
      width: max-content;
      max-width: calc(100vw - 2rem);
      text-align: center;
      transform: translate(-50%, -200%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .egg.is-visible { transform: translate(-50%, 0); }

    .logo-hit {
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .logo-hit.is-shaking { animation: shake 0.4s ease-in-out; }

    .reaction {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 1;
      font: 700 2.5rem/1 ui-monospace, Consolas, "Segoe UI Emoji", monospace;
      color: #fff;
      text-shadow: 0 0 16px rgba(109, 40, 217, 0.9);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0);
    }
    .reaction.is-on { animation: reaction-pop 0.9s ease-out; }
    @keyframes reaction-pop {
      0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -10px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      15% { transform: translate(-8px, 3px) rotate(-5deg); }
      30% { transform: translate(7px, -4px) rotate(4deg); }
      45% { transform: translate(-6px, 2px) rotate(-3deg); }
      60% { transform: translate(5px, -2px) rotate(3deg); }
      80% { transform: translate(-3px, 1px) rotate(-1deg); }
    }

    @media (max-width: 600px) {
      .glow { filter: blur(60px); }
      .discord-btn { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
      .reaction { font-size: 2rem; }
      .secret { font-size: 0.75rem; padding: 0.5rem; right: 0.25rem; bottom: 0.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
  <script type="application/ld+json">{
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Chomicza Nora",
    "url": "https://www.chomiczanora.pl",
    "logo": "https://www.chomiczanora.pl/images/Logo.png",
    "description": "Chomicza Nora — self-hostingowy HomeLAB",
    "sameAs": ["https://discord.com/invite/ChTAqW8yDv","https://ko-fi.com/chomiczanora"]
  }</script>
</head>
<body>
  <div class="glow glow--1" aria-hidden="true"></div>
  <div class="glow glow--2" aria-hidden="true"></div>
  <div class="glow glow--3" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="stars stars--2" aria-hidden="true"></div>

  <main class="logo-wrap">
    <h1 hidden>Chomicza Nora</h1>
    <div class="logo-hit" id="logo-hit">
      <img class="logo" src="images/Logo.png" alt="Chomicza Nora" draggable="false">
    </div>
    <span class="reaction" id="reaction" aria-hidden="true"></span>
  </main>

  <a class="discord-btn" href="https://discord.com/invite/ChTAqW8yDv" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    Discord
  </a>

  <div class="secret" tabindex="0">Jebać Timpa</div>

  <div class="egg" id="egg" role="status" aria-live="polite">Serwer Minecraft: wersja 31</div>

  <script>
    (function () {
      var egg = document.getElementById('egg'), timer;

      function toast(text) {
        egg.textContent = text;
        egg.classList.add('is-visible');
        clearTimeout(timer);
        timer = setTimeout(function () { egg.classList.remove('is-visible'); }, 4000);
      }

      // Easter egg: wpisz "minecraft" na klawiaturze
      var code = 'minecraft', typed = '';
      document.addEventListener('keydown', function (e) {
        if (e.key.length !== 1) return;
        typed = (typed + e.key.toLowerCase()).slice(-code.length);
        if (typed !== code) return;
        typed = '';
        toast('Serwer Minecraft: wersja 31');
      });

      // Logo trzęsie się przy każdym kliknięciu, a co piąte pokazuje losowy napis
      var messages = [
        'Auu! To bolało.',
        'Chomik uciekł do nory.',
        'Nora jest zajęta.',
        'Nie klikaj tak mocno!',
        'Maszynownia działa. Chyba.',
        'Sprawdziłeś już lodówkę?',
        'Chomik ma już dość klikania.',
        'Brawo, odkryłeś sekret!'
      ];
      var hit = document.getElementById('logo-hit'), clicks = 0;
      var reaction = document.getElementById('reaction');
      var faces = ['😭', 'x_x', '😢', '😵', '>_<', 'T_T', '😖'];
      hit.addEventListener('click', function () {
        clicks++;
        hit.classList.remove('is-shaking');
        reaction.classList.remove('is-on');
        void hit.offsetWidth;
        hit.classList.add('is-shaking');
        reaction.textContent = faces[Math.floor(Math.random() * faces.length)];
        reaction.classList.add('is-on');
        if (clicks % 5 === 0) toast(messages[Math.floor(Math.random() * messages.length)]);
      });
      hit.addEventListener('animationend', function () { hit.classList.remove('is-shaking'); });
    })();
  </script>
</body>
</html>
